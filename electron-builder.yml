# appId bleibt bewusst unverändert (aus BibCat-Zeiten), damit neue Installer
# die bestehende Installation aktualisieren statt eine zweite anzulegen.
appId: de.bibcat.app
productName: BibCraft
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - LICENSE
asar: true
# Updates werden über GitHub Releases verteilt (siehe .github/workflows/build.yml)
publish:
  provider: github
  owner: Jordinchen
  repo: BibCat
  releaseType: release
win:
  # Kleine Größen (16–32 px) zeigen nur den Kopf des Phönix, damit er erkennbar bleibt
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  # Dateinamen ohne Leerzeichen, damit sie zu latest.yml passen
  artifactName: BibCraft-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: BibCraft
  # Lizenz (GPL-3.0) im Installer anzeigen
  license: LICENSE
mac:
  icon: build/icon.icns
  category: public.app-category.reference
  artifactName: BibCraft-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [universal]
    # Das ZIP wird nur für die Update-Prüfung (latest-mac.yml) gebraucht
    - target: zip
      arch: [universal]
  extendInfo:
    NSCameraUsageDescription: BibCraft uses the camera to scan ISBN barcodes. / BibCraft nutzt die Kamera, um ISBN-Barcodes zu scannen.
linux:
  target: [AppImage]
  artifactName: BibCraft-${version}-${arch}.${ext}
  category: Office
