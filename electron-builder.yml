# appId bleibt bewusst unverändert (aus BibCat-Zeiten), damit neue Installer
# die bestehende Installation aktualisieren statt eine zweite anzulegen.
appId: de.bibcat.app
productName: BibCraft
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: BibCraft
mac:
  category: public.app-category.reference
  target:
    - target: dmg
      arch: [universal]
  extendInfo:
    NSCameraUsageDescription: BibCraft uses the camera to scan ISBN barcodes. / BibCraft nutzt die Kamera, um ISBN-Barcodes zu scannen.
linux:
  target: [AppImage]
  category: Office
